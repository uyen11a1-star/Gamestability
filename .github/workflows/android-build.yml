name: Android CI

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build GameStability APK
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      accept-android-sdk-licenses: true

  - name: Verify project files
    run: |
      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f app/build.gradle.kts
      test -f app/src/main/AndroidManifest.xml
      echo "Project files found."

  - name: Make Gradle executable
    run: chmod +x gradlew

  - name: Build debug APK
    run: ./gradlew --no-daemon --stacktrace assembleDebug

  - name: Run unit tests
    run: ./gradlew --no-daemon testDebugUnitTest

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: GameStability-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
